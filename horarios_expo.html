<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EXPO - Horários 2026</title>
<style>
body { font-family: system-ui, -apple-system, sans-serif; background: #0a0d14; color: #e0eaf2; margin: 0; padding: 20px; }
.box { background: #161b2e; border: 1px solid #2a3046; border-radius: 10px; padding: 20px; margin: 0 auto 18px auto; max-width: 1000px; }
h1 { text-align: center; color: #4f8ef7; margin-bottom: 4px; }
.sub { text-align: center; color: #6b7280; margin-bottom: 24px; font-size: 14px; }
input, select { background: #0d111c; color: #fff; border: 1px solid #2a3046; padding: 12px; border-radius: 6px; font-size: 14px; }
input { width: 280px; margin-right: 8px; }
select { margin-right: 8px; }
button { background: #4f8ef7; color: #fff; border: 0; padding: 12px 18px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; margin-right: 6px; }
button.alt { background: #34d399; }
button:hover { opacity: 0.9; }
.tag { display: inline-block; background: #252a3a; padding: 4px 10px; border-radius: 4px; margin: 4px 4px 0 0; font-size: 12px; color: #a3aed0; }
.tag.dia { background: #1f2540; color: #4f8ef7; font-weight: 600; }
.tag.horario { background: #1f2540; color: #facc15; font-weight: 600; }
.card { background: #1a1f30; border-left: 4px solid #4f8ef7; padding: 14px 16px; margin: 8px 0; border-radius: 6px; }
.card.rob { border-left-color: #16a34a; }
.card.mat { border-left-color: #3b82f6; }
.card.port { border-left-color: #a78bfa; }
.card.hist { border-left-color: #ef4444; }
.card.edf { border-left-color: #f97316; }
.card.art { border-left-color: #ec4899; }
.erro { background: #5a1a1a; color: #fff; padding: 14px; border-radius: 6px; text-align: center; }
.ok { color: #34d399; font-weight: 700; font-size: 18px; margin: 12px 0; }
.prof-tag { background: #4f8ef7; color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 12px; margin-left: 6px; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 10px; border-bottom: 1px solid #2a3046; text-align: left; font-size: 13px; }
th { background: #1a1f30; color: #6b7280; text-transform: uppercase; font-size: 11px; letter-spacing: 1px; }
.aula-cell { background: #1a1f30; padding: 8px 10px; border-radius: 4px; border-left: 3px solid; }
.aula-cell small { color: #6b7280; font-size: 11px; }
footer { text-align: center; color: #6b7280; font-size: 12px; margin-top: 30px; }
</style>
</head>
<body>

<h1>EXPO - Horarios 2026</h1>
<p class="sub">Sistema de Horarios - Ensino Medio Matutino - Fundamental 6o ao 9o Ano</p>

<div class="box">
  <h3 style="margin-top:0;">Buscar aulas por professor</h3>
  <div>
    <input type="text" id="nome" placeholder="Digite o nome do professor...">
    <select id="dia">
      <option value="">Todos os dias</option>
      <option value="2">2a feira</option>
      <option value="3">3a feira</option>
      <option value="4">4a feira</option>
      <option value="5">5a feira</option>
      <option value="6">6a feira</option>
    </select>
    <button onclick="buscar()">Buscar</button>
    <button class="alt" onclick="listarTudo()">Listar tudo</button>
  </div>
  <div id="resultado" style="margin-top: 16px;"></div>
</div>

<div class="box">
  <h3 style="margin-top:0;">Grade do dia</h3>
  <select id="diaGrade" onchange="renderGrade()">
    <option value="2">2a feira</option>
    <option value="3">3a feira</option>
    <option value="4" selected>4a feira</option>
    <option value="5">5a feira</option>
    <option value="6">6a feira</option>
  </select>
  <div id="grade" style="margin-top:14px;overflow-x:auto;"></div>
</div>

<footer>EXPO - Colegio Exponencial - 2026</footer>

<script>
const DADOS = {
  turmas: ["6o ANO A","7o ANO A","8o ANO A","9o ANO A","9o ANO B"],
  turmasId: ["6A","7A","8A","9A","9B"],
  codigos: ["2","3","4","5","6"],
  diasNome: { 2: "2a feira", 3: "3a feira", 4: "4a feira", 5: "5a feira", 6: "6a feira" },
  grade: {
    "2": {
      "6A": [["7h00-7h50","PROD.TEXTO","Camille"],["7h50-8h40","PROD.TEXTO","Camille"],["8h55-9h45","PORTUGUES","Camille"],["9h45-10h35","ED.FISICA","Keylla"],["10h50-11h40","HISTORIA","Eliene"]],
      "7A": [["7h00-7h50","ROBOTICA","Dario"],["7h50-8h40","GEOGRAFIA","Eliene"],["8h55-9h45","GEOGRAFIA","Eliene"],["9h45-10h35","PORTUGUES","Camille"],["10h50-11h40","INGLES","Camille"]],
      "8A": [["7h00-7h50","CIENCIAS","Andreia"],["7h50-8h40","MATEMATICA","Sidimar"],["8h55-9h45","ED.FISICA","Keylla"],["9h45-10h35","ARTE","Marilice"],["10h50-11h40","MATEMATICA","Sidimar"]],
      "9A": [["7h00-7h50","C.FISICA","Paulo"],["7h50-8h40","C.QUIMICA","Andreia"],["8h55-9h45","MATEMATICA","Sidimar"],["9h45-10h35","MATEMATICA","Sidimar"],["10h50-11h40","ED.FISICA","Keylla"]],
      "9B": [["7h00-7h50","GEOGRAFIA","Eliene"],["7h50-8h40","C.FISICA","Paulo"],["8h55-9h45","ARTE","Marilice"],["9h45-10h35","GEOGRAFIA","Eliene"],["10h50-11h40","ROBOTICA","Dario"]]
    },
    "3": {
      "6A": [["7h00-7h50","MATEMATICA","Sidimar"],["7h50-8h40","MATEMATICA","Sidimar"],["8h55-9h45","PORTUGUES","Camille"],["9h45-10h35","ED.FISICA","Keylla"],["10h50-11h40","HISTORIA","Eliene"]],
      "7A": [["7h00-7h50","MATEMATICA","Sidimar"],["7h50-8h40","CIENCIAS","Andreia"],["8h55-9h45","GEOGRAFIA","Eliene"],["9h45-10h35","PORTUGUES","Camille"],["10h50-11h40","INGLES","Camille"]],
      "8A": [["7h00-7h50","C.FISICA","Paulo"],["7h50-8h40","MATEMATICA","Sidimar"],["8h55-9h45","HISTORIA","Eliene"],["9h45-10h35","ARTE","Marilice"],["10h50-11h40","PORTUGUES","Camille"]],
      "9A": [["7h00-7h50","MATEMATICA","Sidimar"],["7h50-8h40","C.QUIMICA","Andreia"],["8h55-9h45","MATEMATICA","Sidimar"],["9h45-10h35","GEOGRAFIA","Eliene"],["10h50-11h40","INGLES","Camille"]],
      "9B": [["7h00-7h50","C.FISICA","Paulo"],["7h50-8h40","C.FISICA","Paulo"],["8h55-9h45","ARTE","Marilice"],["9h45-10h35","HISTORIA","Eliene"],["10h50-11h40","PORTUGUES","Camille"]]
    },
    "4": {
      "6A": [["7h00-7h50","HISTORIA","Eliene"],["7h50-8h40","PORTUGUES","Camille"],["8h55-9h45","MATEMATICA","Sidimar"],["9h45-10h35","CIENCIAS","Andreia"],["10h50-11h40","ED.FISICA","Keylla"]],
      "7A": [["7h00-7h50","PORTUGUES","Camille"],["7h50-8h40","MATEMATICA","Sidimar"],["8h55-9h45","PORTUGUES","Camille"],["9h45-10h35","MATEMATICA","Sidimar"],["10h50-11h40","ED.FISICA","Keylla"]],
      "8A": [["7h00-7h50","MATEMATICA","Sidimar"],["7h50-8h40","C.FISICA","Paulo"],["8h55-9h45","MATEMATICA","Sidimar"],["9h45-10h35","HISTORIA","Eliene"],["10h50-11h40","INGLES","Camille"]],
      "9A": [["7h00-7h50","C.FISICA","Paulo"],["7h50-8h40","MATEMATICA","Sidimar"],["8h55-9h45","PORTUGUES","Camille"],["9h45-10h35","ARTE","Marilice"],["10h50-11h40","ED.FISICA","Keylla"]],
      "9B": [["7h00-7h50","GEOGRAFIA","Eliene"],["7h50-8h40","MATEMATICA","Sidimar"],["8h55-9h45","INGLES","Camille"],["9h45-10h35","PORTUGUES","Camille"],["10h50-11h40","MATEMATICA","Sidimar"]]
    },
    "5": {
      "6A": [["7h00-7h50","MATEMATICA","Sidimar"],["7h50-8h40","MATEMATICA","Sidimar"],["8h55-9h45","CIENCIAS","Andreia"],["9h45-10h35","PORTUGUES","Camille"],["10h50-11h40","HISTORIA","Eliene"]],
      "7A": [["7h00-7h50","CIENCIAS","Andreia"],["7h50-8h40","GEOGRAFIA","Eliene"],["8h55-9h45","MATEMATICA","Sidimar"],["9h45-10h35","ED.FISICA","Keylla"],["10h50-11h40","HISTORIA","Eliene"]],
      "8A": [["7h00-7h50","MATEMATICA","Sidimar"],["7h50-8h40","PORTUGUES","Camille"],["8h55-9h45","INGLES","Camille"],["9h45-10h35","CIENCIAS","Andreia"],["10h50-11h40","MATEMATICA","Sidimar"]],
      "9A": [["7h00-7h50","MATEMATICA","Sidimar"],["7h50-8h40","PORTUGUES","Camille"],["8h55-9h45","C.QUIMICA","Andreia"],["9h45-10h35","GEOGRAFIA","Eliene"],["10h50-11h40","ED.FISICA","Keylla"]],
      "9B": [["7h00-7h50","ARTE","Marilice"],["7h50-8h40","HISTORIA","Eliene"],["8h55-9h45","GEOGRAFIA","Eliene"],["9h45-10h35","ARTE","Marilice"],["10h50-11h40","INGLES","Camille"]]
    },
    "6": {
      "6A": [["7h00-7h50","GEOGRAFIA","Eliene"],["7h50-8h40","CIENCIAS","Andreia"],["8h55-9h45","PORTUGUES","Camille"],["9h45-10h35","MATEMATICA","Sidimar"],["10h50-11h40","ED.FISICA","Keylla"]],
      "7A": [["7h00-7h50","INGLES","Camille"],["7h50-8h40","ROBOTICA","Dario"],["8h55-9h45","HISTORIA","Eliene"],["9h45-10h35","CIENCIAS","Andreia"],["10h50-11h40","MATEMATICA","Sidimar"]],
      "8A": [["7h00-7h50","PORTUGUES","Camille"],["7h50-8h40","INGLES","Camille"],["8h55-9h45","MATEMATICA","Sidimar"],["9h45-10h35","CIENCIAS","Andreia"],["10h50-11h40","ED.FISICA","Keylla"]],
      "9A": [["7h00-7h50","INGLES","Camille"],["7h50-8h40","GEOGRAFIA","Eliene"],["8h55-9h45","C.QUIMICA","Andreia"],["9h45-10h35","MATEMATICA","Sidimar"],["10h50-11h40","ARTE","Marilice"]],
      "9B": [["7h00-7h50","PORTUGUES","Camille"],["7h50-8h40","MATEMATICA","Sidimar"],["8h55-9h45","C.QUIMICA","Andreia"],["9h45-10h35","PORTUGUES","Camille"],["10h50-11h40","GEOGRAFIA","Eliene"]]
    }
  }
};

const COR_DISC = {
  "MATEMATICA":"#3b82f6","PORTUGUES":"#a78bfa","INGLES":"#a78bfa","PROD.TEXTO":"#a78bfa",
  "CIENCIAS":"#06b6d4","C.FISICA":"#facc15","C.QUIMICA":"#facc15",
  "HISTORIA":"#ef4444","GEOGRAFIA":"#ef4444","ED.FISICA":"#f97316",
  "ARTE":"#ec4899","ROBOTICA":"#16a34a"
};

function corDaDisc(d) { return COR_DISC[d] || "#4f8ef7"; }

function buscar() {
  const nome = document.getElementById("nome").value.trim().toLowerCase();
  const dia  = document.getElementById("dia").value;
  const res  = document.getElementById("resultado");

  if (!nome) {
    res.innerHTML = '<div class="erro">Digite o nome de um professor para buscar.</div>';
    return;
  }

  const achados = [];
  DADOS.codigos.forEach(cd => {
    if (dia && cd !== dia) return;
    DADOS.turmasId.forEach((tid, i) => {
      DADOS.grade[cd][tid].forEach(aula => {
        if (aula[2].toLowerCase().indexOf(nome) !== -1) {
          achados.push({
            diaCod: cd,
            diaNome: DADOS.diasNome[cd],
            turma: DADOS.turmas[i],
            horario: aula[0],
            disciplina: aula[1],
            professor: aula[2]
          });
        }
      });
    });
  });

  if (achados.length === 0) {
    res.innerHTML = '<div class="erro">Nenhuma aula encontrada para "' + nome + '"' +
      (dia ? ' na ' + DADOS.diasNome[dia] : '') + '.</div>';
    return;
  }

  let html = '<div class="ok">' + achados.length + ' aula(s) encontrada(s)</div>';
  achados.forEach(a => {
    const cor = corDaDisc(a.disciplina);
    html += '<div class="card" style="border-left-color:' + cor + ';">' +
            '<div style="font-size:16px;font-weight:700;color:' + cor + ';">' + a.disciplina +
            ' <span class="prof-tag">' + a.professor + '</span></div>' +
            '<div style="margin-top:6px;">' +
              '<span class="tag dia">' + a.diaNome + '</span>' +
              '<span class="tag">' + a.turma + '</span>' +
              '<span class="tag horario">' + a.horario + '</span>' +
            '</div>' +
            '</div>';
  });
  res.innerHTML = html;
}

function listarTudo() {
  const res = document.getElementById("resultado");
  const professores = {};
  DADOS.codigos.forEach(cd => {
    DADOS.turmasId.forEach((tid, i) => {
      DADOS.grade[cd][tid].forEach(aula => {
        if (!professores[aula[2]]) professores[aula[2]] = [];
        professores[aula[2]].push({
          dia: cd, diaNome: DADOS.diasNome[cd],
          turma: DADOS.turmas[i],
          horario: aula[0],
          disciplina: aula[1]
        });
      });
    });
  });

  let html = '<div class="ok">Todos os professores e suas aulas (' + Object.keys(professores).length + ' professores)</div>';
  Object.keys(professores).sort().forEach(prof => {
    html += '<h4 style="color:#a78bfa;margin-top:18px;margin-bottom:8px;">Prof. ' + prof + ' <small style="color:#6b7280;font-weight:400;">(' + professores[prof].length + ' aulas)</small></h4>';
    professores[prof].forEach(a => {
      const cor = corDaDisc(a.disciplina);
      html += '<div class="card" style="border-left-color:' + cor + ';">' +
              '<div style="font-size:14px;font-weight:700;color:' + cor + ';">' + a.disciplina + '</div>' +
              '<div style="margin-top:4px;">' +
                '<span class="tag dia">' + a.diaNome + '</span>' +
                '<span class="tag">' + a.turma + '</span>' +
                '<span class="tag horario">' + a.horario + '</span>' +
              '</div>' +
              '</div>';
    });
  });
  res.innerHTML = html;
}

function renderGrade() {
  const dia = document.getElementById("diaGrade").value;
  const cont = document.getElementById("grade");
  const horarios = ["7h00-7h50","7h50-8h40","8h55-9h45","9h45-10h35","10h50-11h40"];

  let html = '<table><tr><th>Horario</th>';
  DADOS.turmas.forEach(t => html += '<th>' + t + '</th>');
  html += '</tr>';

  horarios.forEach(h => {
    html += '<tr><td style="font-family:monospace;color:#6b7280;">' + h + '</td>';
    DADOS.turmasId.forEach(tid => {
      const aula = DADOS.grade[dia][tid].find(a => a[0] === h);
      if (aula) {
        const cor = corDaDisc(aula[1]);
        html += '<td><div class="aula-cell" style="border-left-color:' + cor + ';">' +
                '<b style="color:' + cor + ';">' + aula[1] + '</b><br>' +
                '<small>' + aula[2] + '</small></div></td>';
      } else {
        html += '<td></td>';
      }
    });
    html += '</tr>';
    if (h === "7h50-8h40" || h === "9h45-10h35") {
      html += '<tr><td colspan="6" style="text-align:center;color:#6b7280;padding:6px;font-size:12px;letter-spacing:1px;">INTERVALO</td></tr>';
    }
  });
  html += '</table>';
  cont.innerHTML = html;
}

document.getElementById("nome").addEventListener("input", buscar);
document.getElementById("dia").addEventListener("change", buscar);

renderGrade();
listarTudo();
</script>

</body>
</html>
